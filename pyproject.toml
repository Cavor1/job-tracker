[project]
name = "job-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "prompt-toolkit>=3.0.52",
    "pytest>=9.0.3",
    "sqlalchemy>=2.0.50",
]

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_tracker"]

[project.scripts]
startapp = "job_tracker.main:main"
